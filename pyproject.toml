[project]
name = "workforce-ops"
version = "0.1.0"
description = "Workforce operations system for manufacturing shopfloor staffing, skills, shifts, and qualifications."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.0",
    "fastapi>=0.136.1",
    "openai>=2.36.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "sse-starlette>=3.4.2",
    "uvicorn[standard]>=0.46.0",
    "chromadb>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "mypy>=1.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.*"
# Business code has existing mypy issues; don't modify it
strict_optional = false
disable_error_code = ["no-untyped-def", "no-untyped-call", "assignment", "arg-type", "return-value", "union-attr", "type-arg", "var-annotated", "override", "misc", "attr-defined", "import-untyped", "index", "no-any-return", "call-overload", "no-redef"]

[[tool.mypy.overrides]]
module = "tests.*"
# Test code: allow pytest fixtures and common test patterns
disable_error_code = ["no-untyped-def", "no-untyped-call", "assignment", "arg-type", "return-value", "union-attr", "var-annotated", "type-arg", "override", "misc", "attr-defined", "import-untyped", "redundant-expr", "comparison-overlap", "unused-coroutine", "index", "no-any-return", "call-overload"]

[[tool.mypy.overrides]]
module = "main"
disable_error_code = ["no-untyped-def", "no-untyped-call"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
